name: Deploy AMXXR site to Pages

on:
  push:
    branches: [claude/gallant-goodall-rj2vu1]
    paths:
      - 'amxxr-website/**'
      - '.github/workflows/deploy-amxxr-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: amxxr-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure Pages (auto-enable)
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./amxxr-website
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
