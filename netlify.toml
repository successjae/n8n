# Netlify configuration (repository root).
#
# The deployable site lives in the success-jae-site/ subdirectory of this
# monorepo. Declaring `base` here pins the build to that folder and overrides
# Netlify's monorepo "Project to deploy" picker, so no manual base-directory
# selection is needed in the UI.

[build]
  base = "success-jae-site"
  command = "pnpm build"
  # Path is written relative to the repository root (Netlify monorepo convention),
  # pinned so a stale publish value from the UI picker can't override it.
  publish = "success-jae-site/.next"

[build.environment]
  NODE_VERSION = "20"

# Official Next.js runtime — handles SSR/ISR and next/image.
[[plugins]]
  package = "@netlify/plugin-nextjs"
