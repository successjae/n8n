<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Contact &amp; Booking — AMXXR</title>
	<meta name="description" content="Book AMXXR for shows and appearances, reach management, send press requests or start a sponsorship conversation.">
	<meta name="theme-color" content="#0b0a08">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

	<section class="page-hero">
		<div class="hero-bg"></div>
		<div class="wrap">
			<span class="kicker">Get in Touch</span>
			<h1>Contact<br>&amp; Booking</h1>
			<p>Shows, features, press, partnerships — pick the right lane and the right person answers.</p>
		</div>
	</section>

	<section>
		<div class="wrap">
			<div class="split" style="align-items:start">
				<div>
					<div class="chips reveal" id="formTabs">
						<button class="chip active" data-form="booking">Booking</button>
						<button class="chip" data-form="sponsor">Sponsorship</button>
						<button class="chip" data-form="media">Media</button>
						<button class="chip" data-form="general">General</button>
					</div>
					<div class="panel reveal" id="formPanel"></div>
				</div>
				<div class="reveal reveal-d1">
					<span class="kicker">Direct Lines</span>
					<h2 class="section-title" style="font-size:clamp(1.6rem,4vw,2.4rem)">Or email<br>directly</h2>
					<div id="directContacts" style="margin-top:24px"></div>
					<hr class="divider">
					<h4 style="font-size:11px;letter-spacing:.26em;text-transform:uppercase;color:var(--gold);margin-bottom:16px">Follow</h4>
					<div class="socials-row" id="socialRow"></div>
				</div>
			</div>
		</div>
	</section>

	<script src="assets/js/data.js"></script>
	<script src="assets/js/main.js"></script>
	<script src="assets/js/store.js"></script>
	<script>
	(() => {
		const A = window.AMXXR, S = A.SITE;

		const FORMS = {
			booking: {
				title: 'Book AMXXR', tag: 'booking-lead', source: 'booking inquiry',
				fields: `
					<div class="grid grid-2" style="gap:14px">
						<div class="field"><label>Your name *</label><input name="name" required></div>
						<div class="field"><label>Email *</label><input type="email" name="email" required></div>
						<div class="field"><label>Venue / Event</label><input name="social" placeholder="Venue or event name"></div>
						<div class="field"><label>City &amp; Date</label><input name="city" placeholder="City, target date"></div>
					</div>
					<div class="field"><label>Budget range</label>
						<select name="state"><option>Under $2,500</option><option>$2,500 – $7,500</option><option>$7,500 – $20,000</option><option>$20,000+</option></select>
					</div>
					<div class="field"><label>Event details</label><textarea name="country" placeholder="Capacity, format, set length…"></textarea></div>`,
				cta: 'Send Booking Inquiry',
			},
			sponsor: {
				title: 'Partner With AMXXR', tag: 'sponsor-lead', source: 'sponsor inquiry',
				fields: `
					<div class="grid grid-2" style="gap:14px">
						<div class="field"><label>Contact name *</label><input name="name" required></div>
						<div class="field"><label>Email *</label><input type="email" name="email" required></div>
					</div>
					<div class="field"><label>Brand / Company *</label><input name="social" required></div>
					<div class="field"><label>Partnership idea</label><textarea name="country"></textarea></div>`,
				cta: 'Send Partnership Inquiry',
			},
			media: {
				title: 'Media Request', tag: 'media-contact', source: 'media inquiry',
				fields: `
					<div class="grid grid-2" style="gap:14px">
						<div class="field"><label>Your name *</label><input name="name" required></div>
						<div class="field"><label>Email *</label><input type="email" name="email" required></div>
					</div>
					<div class="field"><label>Outlet / Platform</label><input name="social"></div>
					<div class="field"><label>Request (interview, premiere, quotes…)</label><textarea name="country"></textarea></div>`,
				cta: 'Send Media Request',
			},
			general: {
				title: 'Say What\'s Up', tag: 'general-contact', source: 'contact form',
				fields: `
					<div class="grid grid-2" style="gap:14px">
						<div class="field"><label>Your name *</label><input name="name" required></div>
						<div class="field"><label>Email *</label><input type="email" name="email" required></div>
					</div>
					<div class="field"><label>Message</label><textarea name="country" required></textarea></div>`,
				cta: 'Send Message',
			},
		};

		const panel = document.getElementById('formPanel');
		const renderForm = (key) => {
			const f = FORMS[key];
			panel.innerHTML = `
				<h2 style="font-size:1.7rem;margin-bottom:22px">${f.title}</h2>
				<form data-fan-form data-source="${f.source}" data-tags="${f.tag}" data-success-msg="Sent — the team will get back to you.">
					${f.fields}
					<button class="btn btn-solid" type="submit" style="width:100%">${f.cta}</button>
				</form>
				<div class="form-success">Received. The team responds to every serious inquiry within 48 hours.</div>`;
		};
		document.getElementById('formTabs').addEventListener('click', (e) => {
			const b = e.target.closest('.chip');
			if (!b) return;
			document.querySelectorAll('#formTabs .chip').forEach(c => c.classList.remove('active'));
			b.classList.add('active');
			renderForm(b.dataset.form);
		});
		renderForm('booking');

		document.getElementById('directContacts').innerHTML = [
			['Booking', S.contacts.booking],
			['Management (Threesixty Ent.)', S.contacts.management],
			['Press', S.contacts.press],
			['Sponsorships', S.contacts.sponsors],
		].map(([l, e]) => `
			<div style="padding:14px 0;border-bottom:1px solid var(--line)">
				<div style="font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--cream-faint);margin-bottom:4px">${l}</div>
				<a href="mailto:${e}">${e}</a>
			</div>`).join('');

		document.getElementById('socialRow').innerHTML = [
			['Instagram', S.socials.instagram], ['Spotify', S.socials.spotify],
			['YouTube', S.socials.youtube], ['Bandcamp', S.socials.bandcamp], ['SoundCloud', S.socials.soundcloud],
		].map(([l, u]) => `<a href="${u}" target="_blank" rel="noopener">${l}</a>`).join('');

		AMXXR_observeReveals();
	})();
	</script>
</body>
</html>
